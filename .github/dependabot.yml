version: 2
updates:
  # Go modules — batch minor/patch updates weekly, limit open PRs
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    groups:
      # Group all minor and patch bumps into one PR per week
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Hold major version bumps for manual review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — update SHA-pinned actions weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Group all action updates into one PR per week
      actions:
        patterns:
          - "*"
