# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - gocritic
    - misspell
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          severity: warning

    govet:
      enable-all: true
      disable:
        - fieldalignment

    gosec:
      excludes:
        - G104 # Unhandled errors (intentional in selected places)
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
